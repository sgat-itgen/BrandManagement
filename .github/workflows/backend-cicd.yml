name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "BE/brand_management/**"
      - ".github/workflows/backend-cicd.yml"
      - "render.yaml"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/brand-management-backend

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BE/brand_management

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: |
          chmod +x mvnw
          ./mvnw -B test

  publish:
    name: Build and push Docker image
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./BE/brand_management
          file: ./BE/brand_management/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE_URL: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/brand-management-backend:sha-${{ github.sha }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL" || {
            echo "RENDER_DEPLOY_HOOK_URL is not configured"
            exit 1
          }

          encoded_image=$(printf '%s' "$IMAGE_URL" | sed 's#/#%2F#g; s#:#%3A#g')
          curl --fail --show-error --silent --request POST \
            "${RENDER_DEPLOY_HOOK_URL}&imgURL=${encoded_image}"
