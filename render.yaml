services:
  - type: web
    name: brand-management-backend
    runtime: image
    plan: free
    region: singapore
    image:
      url: docker.io/itanthaisaigon/brand-management-backend:latest
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "10000"
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: APP_SEED_ENABLED
        value: "false"
      - key: DB_POOL_SIZE
        value: "5"
      - key: APP_STORAGE_ROOT
        value: /var/data/uploads
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
