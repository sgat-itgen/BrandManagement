services:
  postgres:
    image: 'postgres:17-alpine'
    environment:
      POSTGRES_DB: brand_management
      POSTGRES_USER: brand_management
      POSTGRES_PASSWORD: brand_management
    ports:
      - '5432:5432'
    volumes:
      - brand-management-postgres-data:/var/lib/postgresql/data
  redis:
    image: 'redis:7-alpine'
    ports:
      - '6379:6379'

volumes:
  brand-management-postgres-data:
