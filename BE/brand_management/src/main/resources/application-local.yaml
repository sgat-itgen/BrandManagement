spring:
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE}
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  seed:
    enabled: ${APP_SEED_ENABLED}
